<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RodoviaVis — Acidentes em Rodovias Federais</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/mapa.css">
    <link rel="stylesheet" href="css/calendario.css">
    <link rel="stylesheet" href="css/matriz.css">
    <link rel="stylesheet" href="css/scatterplot.css">
</head>

<body>
    <header class="cabecalho">
        <div>
            <p class="cabecalho__identificacao">Grupo 06</p>

            <h1>RodoviaVis</h1>

            <p>
                Sistema de análise visual de padrões e gravidade em
                acidentes nas rodovias federais brasileiras entre
                2022 e 2024.
            </p>
        </div>
    </header>

    <section id="filtros-globais" aria-label="Filtros do sistema"></section>

    <section id="painel-kpis" aria-label="Indicadores gerais"></section>

    <main class="dashboard">
        <section id="mapa-container" class="painel">
            <h2>Distribuição geográfica</h2>
        </section>

        <section id="scatterplot-container" class="painel">
            <h2>Perfil de risco</h2>
        </section>

        <section id="calendario-container" class="painel">
            <h2>Padrões temporais</h2>
        </section>

        <section id="matriz-container" class="painel">
            <h2>Padrões contextuais</h2>
        </section>
    </main>

    <section id="timeline-container" class="painel">
        <h2>Seleção do período</h2>
    </section>

    <section id="detalhes-selecao" aria-live="polite"></section>

    <div id="tooltip-global" class="tooltip" hidden></div>

    <!-- D3 deverá ser armazenado localmente antes da entrega final. -->
    <script src="lib/d3.v7.min.js"></script>

    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/filtros.js"></script>
    <script src="js/kpis.js"></script>
    <script src="js/mapa.js"></script>
    <script src="js/scatterplot.js"></script>
    <script src="js/calendario.js"></script>
    <script src="js/matriz.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
