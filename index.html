<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RodoviaVis — Acidentes em Rodovias Federais</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/kpis.css">
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="css/mapa.css">
    <link rel="stylesheet" href="css/calendario.css">
    <link rel="stylesheet" href="css/matriz.css">
    <link rel="stylesheet" href="css/scatterplot.css">
</head>

<body>
    <header class="cabecalho">
        <div>
            <p class="cabecalho__identificacao">Grupo 06</p>

            <h1>RodoviaVis</h1>

            <p>
                Sistema de análise visual de padrões e gravidade em
                acidentes nas rodovias federais brasileiras entre
                2022 e 2024.
            </p>
        </div>
    </header>

    <section id="filtros-globais" aria-label="Controles globais do sistema">
        <h2 class="filtros-globais__titulo">Filtros e métricas</h2>

        <div class="filtros-globais__grupo">
            <label for="filtro-ano">Ano</label>
            <select id="filtro-ano">
                <option value="">Todos</option>
                <option value="2022">2022</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
            </select>
        </div>

        <div class="filtros-globais__grupo">
            <label for="filtro-uf">UF</label>
            <select id="filtro-uf">
                <option value="">Todas</option>
                <option value="AC">AC</option>
                <option value="AL">AL</option>
                <option value="AM">AM</option>
                <option value="AP">AP</option>
                <option value="BA">BA</option>
                <option value="CE">CE</option>
                <option value="DF">DF</option>
                <option value="ES">ES</option>
                <option value="GO">GO</option>
                <option value="MA">MA</option>
                <option value="MG">MG</option>
                <option value="MS">MS</option>
                <option value="MT">MT</option>
                <option value="PA">PA</option>
                <option value="PB">PB</option>
                <option value="PE">PE</option>
                <option value="PI">PI</option>
                <option value="PR">PR</option>
                <option value="RJ">RJ</option>
                <option value="RN">RN</option>
                <option value="RO">RO</option>
                <option value="RR">RR</option>
                <option value="RS">RS</option>
                <option value="SC">SC</option>
                <option value="SE">SE</option>
                <option value="SP">SP</option>
                <option value="TO">TO</option>
            </select>
        </div>

        <div class="filtros-globais__grupo">
            <label for="filtro-metrica">Métrica</label>
            <select id="filtro-metrica">
                <option value="total_acidentes">Total de acidentes</option>
                <option value="total_graves_fatais">Acidentes graves ou fatais</option>
                <option value="total_mortos">Mortos</option>
                <option value="total_feridos_graves">Feridos graves</option>
                <option value="total_vitimas">Total de vítimas</option>
                <option value="taxa_gravidade">Taxa de gravidade</option>
            </select>
        </div>

        <button id="filtro-limpar" type="button">Restaurar visualização</button>
    </section>

    <section id="painel-kpis" aria-label="Indicadores gerais"></section>

    <main class="dashboard">
        <section id="mapa-container" class="painel">
            <h2>Distribuição geográfica</h2>
        </section>

        <section id="scatterplot-container" class="painel">
            <h2>Perfil de risco</h2>
        </section>

        <section id="calendario-container" class="painel">
            <h2>Padrões temporais</h2>
        </section>

        <section id="matriz-container" class="painel">
            <h2>Padrões contextuais</h2>
        </section>
    </main>

    <section id="timeline-container" class="painel">
        <h2>Seleção do período</h2>
    </section>

    <p id="detalhes-selecao" class="detalhes-selecao" role="status" aria-live="polite"></p>

    <div id="tooltip-global" class="tooltip" role="tooltip" hidden></div>

    <!-- Biblioteca D3 v7 armazenada localmente para execução offline. -->
    <script src="lib/d3.v7.min.js"></script>

    <!--
        A ordem abaixo importa. utils.js faz "d3.select('#tooltip-global')"
        assim que é carregado, então a div já precisa existir acima (e existe,
        já que os scripts estão no final do body). state.js e utils.js vêm
        antes de qualquer módulo de layout, porque todos dependem deles.
        app.js é sempre o último, porque ele é quem inicializa os módulos.
    -->
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/filtros.js"></script>
    <script src="js/kpis.js"></script>
    <script src="js/mapa.js"></script>
    <script src="js/scatterplot.js"></script>
    <script src="js/calendario.js"></script>
    <script src="js/matriz.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
